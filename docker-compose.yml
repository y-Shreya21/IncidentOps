version: '3.8'

services:
  # 1. PostgreSQL Database (Persistent Source of Truth)
  postgres:
    image: postgres:15-alpine
    container_name: incidentops-postgres
    environment:
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: incidentops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops -d incidentops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incidentops-net

  # 2. Redis Caching & Event Broker (Layer 10)
  redis:
    image: redis:7-alpine
    container_name: incidentops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - incidentops-net

  # 3. AI IncidentOps FastAPI Backend (Layer 4)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentops-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://incidentops:secretpassword@postgres:5432/incidentops_db
      - REDIS_URL=redis://redis:6379/0
      - MOCK_LLM=true
      - API_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - incidentops-net

  # 4. React + TypeScript Operations Frontend (Layer 3)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidentops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - incidentops-net

  # 5. Simulated Microservice: Auth Service
  auth-service:
    build:
      context: ./infrastructure
      dockerfile: services/Dockerfile.auth
    container_name: incidentops-auth-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - incidentops-net

  # 6. Simulated Microservice: Payment API
  payment-api:
    build:
      context: ./infrastructure
      dockerfile: services/Dockerfile.payment
    container_name: incidentops-payment-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - AUTH_HOST=auth-service
    networks:
      - incidentops-net

networks:
  incidentops-net:
    driver: bridge

volumes:
  pgdata:

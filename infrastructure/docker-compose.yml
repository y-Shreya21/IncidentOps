version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: incidentops-postgres
    environment:
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: checkout_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops -d checkout_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - incidentops-net

  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile.auth
    container_name: incidentops-auth-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - incidentops-net

  payment-api:
    build:
      context: .
      dockerfile: services/Dockerfile.payment
    container_name: incidentops-payment-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - AUTH_HOST=auth-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - incidentops-net

  frontend:
    build:
      context: .
      dockerfile: services/Dockerfile.frontend
    container_name: incidentops-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PAYMENT_API_HOST=payment-api
    networks:
      - incidentops-net

networks:
  incidentops-net:
    driver: bridge
